let _retraitView = 'mine';

window.chargerMesRetraits = function() {
    _retraitView = 'mine';
    const myKey = dbKey(myPhone);
    const div = document.getElementById('retrait-list');
    if (div) div.innerHTML = '<div class="loom-loader"><span></span><span></span><span></span><span></span><span></span></div>';
    Promise.all([
        db.ref('ika_retraits_domicile').orderByChild('clientPhone').equalTo(myKey).once('value'),
        db.ref('ika_retraits_domicile').orderByChild('agentPhone').equalTo(myKey).once('value')
    ]).then(([clientSnap, agentSnap]) => {
        if (_retraitView !== 'mine') return;
        const div2 = document.getElementById('retrait-list');
        if (!div2) return;
        const items = {};
        clientSnap.forEach(c => { items[c.key] = c.val(); });
        agentSnap.forEach(c => { const d = c.val(); if (['en_cours', 'livre', 'termine', 'litige', 'negociation'].includes(d.statut)) items[c.key] = d; });
        const keys = Object.keys(items);
        if (!keys.length) { div2.innerHTML = '<div style="text-align:center;padding:26px;color:var(--sub);font-size:12px;">💵 Aucune demande</div>'; return; }
        keys.sort((a, b) => (items[b].date || 0) - (items[a].date || 0));
        div2.innerHTML = keys.map(id => renderRetraitCard(id, items[id])).join('');
    });
};

window.renderRetraitCard = function(id, d) {
    const myKey = dbKey(myPhone);
    const frais = d.frais || calculerFraisRetraitDomicile(d.montant).frais;
    const statut = d.statut || 'en_attente';
    const borderColor = statut === 'en_cours' || statut === 'livre' ? 'var(--info)' : statut === 'termine' ? 'var(--green)' : statut === 'litige' ? 'var(--red)' : statut === 'negociation' ? 'var(--orange)' : 'var(--gold)';
    const estAgentVue = d.agentPhone === myKey;
    const gainAgent = Math.round(frais * 0.7);
    const gainPlateforme = Math.round(frais * 0.3);
    let actions = '';
    if (statut === 'en_attente' && d.clientPhone === myKey) {
        actions = `<button onclick="annulerRetraitDomicile('${id}')" class="btn btn-xs btn-outline" style="margin-top:4px;">❌ Annuler</button>`;
    } else if (statut === 'en_attente' && estAgentVue) {
        actions = `<button onclick="proposerFraisRetraitDomicile('${id}',${frais})" class="btn btn-xs btn-nego" style="margin-top:4px;">💰 Proposer frais</button>`;
    } else if (statut === 'negociation' && d.clientPhone === myKey && d.frais_propose) {
        actions = `<div style="font-size:11px;color:var(--gold);margin:4px 0;">💰 Proposition : ${d.frais_propose.toLocaleString()} CFA</div>
            <div style="display:flex;gap:4px;margin-top:4px;">
                <button onclick="repondreNegociationRetraitDomicile('${id}',true)" class="btn btn-xs btn-primary">✅ Accepter</button>
                <button onclick="repondreNegociationRetraitDomicile('${id}',false)" class="btn btn-xs btn-danger">❌ Refuser</button>
            </div>`;

window.agentDepot = function() {
    const telRaw = document.getElementById('agent-target')?.value.trim();
    const amt = parseInt(document.getElementById('agent-amt')?.value);
    if (!telRaw || !amt || amt <= 0) return toast("Remplis numéro + montant", 'var(--red)');
    if (amt > 1000000) return toast("❌ Montant max : 1.000.000 CFA", 'var(--red)');
    if (amt < 100) return toast("❌ Montant min : 100 CFA", 'var(--red)');
    const tel = normalizePhone(telRaw);
    const telKey = dbKey(tel);
    const myKey = dbKey(myPhone);
    db.ref('users/' + telKey).once('value', s => {
        if (!s.exists()) return toast("Numéro introuvable", 'var(--red)');
        const clientName = s.val().name;
        db.ref('users/' + myKey + '/solde').once('value', snapSolde => {
            const soldeAgent = snapSolde.val() || 0;
            if (soldeAgent < amt) {
                return toast(`❌ Solde insuffisant !\nVous avez : ${soldeAgent.toLocaleString()} CFA\nBesoin de : ${amt.toLocaleString()} CFA`, 'var(--red)');
            }
            const pin = prompt(`🔒 PIN de l'agent pour confirmer le dépôt de ${amt.toLocaleString()} CFA à ${clientName} :`);
            if (pin === null) return;
            if (!checkPin(pin)) {
                db.ref('users/' + myKey + '/tentatives_pin').transaction(v => (v || 0) + 1);
                return toast("❌ PIN incorrect", 'var(--red)');
            }
            db.ref('users/' + myKey + '/solde').transaction(function(currentSolde) {
                if (currentSolde < amt) return;
                return currentSolde - amt;
            }, function(error, committed) {
                if (error || !committed) return toast("❌ Erreur transaction", 'var(--red)');
                db.ref('users/' + telKey + '/solde').transaction(v => (v || 0) + amt);
                const commission = Math.round(amt * 0.01);
                db.ref('users/' + myKey + '/solde').transaction(v => (v || 0) + commission);
                db.ref('agents/' + myKey + '/commissions').transaction(v => (v || 0) + commission);
                db.ref('agents/' + myKey + '/transactions').transaction(v => (v || 0) + 1);
                const nonce = Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
                const numConf = 'IK' + nonce.toUpperCase();
                logHistory(telKey, '📥 DÉPÔT AGENT (' + me.name + ')', amt);
                logHistory(myKey, '💸 DÉPÔT AGENT (sortie)', -amt);
                logHistory(myKey, '🎁 COMMISSION (' + clientName + ')', commission);
                envoyerNotification(telKey, {
                    type: 'depot_recu', titre: '📥 Dépôt reçu !',
                    message: `${me.name} vous a déposé ${amt.toLocaleString()} CFA\n📌 ${numConf}`,
                    date: Date.now(), lu: false, montant: amt, agent: me.name, confirmation: numConf, nonce: nonce
                });
                toast(`✅ ${amt.toLocaleString()} CFA déposés pour ${clientName} !\n💰 Commission : ${commission.toLocaleString()} CFA\n📌 ${numConf}`);
                document.getElementById('agent-target').value = '';
                document.getElementById('agent-amt').value = '';
            });
        });
    });
};

window.confirmerRetraitGuichet = function(notificationKey, montant, agentPhone, agentName) {
    const pin = prompt(`🔒 Confirmez le retrait de ${montant.toLocaleString()} CFA à ${agentName} ?\n\nEntrez votre PIN :`);
    if (pin === null) return;
    if (!checkPin(pin)) {
        const myKey = dbKey(myPhone);
        db.ref('users/' + myKey + '/tentatives_pin').once('value', snap => {
            const tentatives = (snap.val() || 0) + 1;
            db.ref('users/' + myKey + '/tentatives_pin').set(tentatives);
            if (tentatives >= 5) {
                db.ref('users/' + myKey + '/bloque').set({ jusqua: Date.now() + 15 * 60 * 1000, raison: 'Trop de tentatives PIN' });
                toast(`🔒 Compte bloqué pour 15 minutes`, 'var(--red)');
            } else {
                toast(`❌ PIN incorrect (${5 - tentatives} tentatives restantes)`, 'var(--red)');
            }
        });
        return;
    }
    const myKey = dbKey(myPhone);
    db.ref('users/' + myKey + '/tentatives_pin').set(0);
    const agentKey = dbKey(agentPhone);
    db.ref('users/' + myKey + '/solde').once('value', s => {
        const solde = s.val() || 0;
        if (solde < montant) return toast(`❌ Solde insuffisant : ${solde.toLocaleString()} CFA`, 'var(--red)');
        const fraisInfo = calculerFraisRetraitGuichet(montant);
        const gainAgent = Math.round(fraisInfo.frais * 0.5);
        const gainPlateforme = Math.round(fraisInfo.frais * 0.5);
        const nonce = Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        const numConf = 'IK' + nonce.toUpperCase();
        db.ref('users/' + myKey + '/solde').transaction(function(currentSolde) {
            if (currentSolde < montant) return;
            return currentSolde - montant;
        }, function(error, committed) {
            if (error || !committed) return toast("❌ Erreur transaction", 'var(--red)');
            db.ref('users/' + agentKey + '/solde').transaction(v => (v || 0) + gainAgent);
            db.ref('users/' + dbKey(ADMIN) + '/solde').transaction(v => (v || 0) + gainPlateforme);
            db.ref('agents/' + agentKey + '/commissions').transaction(v => (v || 0) + gainAgent);
            db.ref('agents/' + agentKey + '/transactions').transaction(v => (v || 0) + 1);
            logHistory(myKey, '📤 RETRAIT GUICHET', -montant);
            logHistory(agentKey, '💵 COMMISSION RETRAIT GUICHET', gainAgent);
            logHistory(dbKey(ADMIN), '💸 COMMISSION RETRAIT GUICHET', gainPlateforme);
            db.ref('notifications/' + myKey + '/' + notificationKey + '/statut').set('traite');
            envoyerNotification(agentKey, {
                type: 'retrait_confirme_client', titre: '✅ Retrait confirmé par le client',
                message: `${me.name} a confirmé le retrait de ${montant.toLocaleString()} CFA.\n📌 ${numConf}\n💰 Commission : ${gainAgent.toLocaleString()} CFA`,
                date: Date.now(), lu: false, confirmation: numConf
            });
            envoyerNotification(myKey, {
                type: 'retrait_effectue', titre: '💸 Retrait effectué',
                message: `Vous avez retiré ${montant.toLocaleString()} CFA en agence.\n📌 ${numConf}`,
                date: Date.now(), lu: false, confirmation: numConf
            });
            toast(`✅ Retrait confirmé ! ${gainAgent.toLocaleString()} CFA pour l'agent\n📌 ${numConf}`);
            openNotifications();
        });
    });
};

window.choisirPaiementShop = function(mode) {
    _paiementChoisi = mode;
    document.querySelectorAll('#paiement-choix-shop .p-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.paiement === mode);
    });
    document.getElementById('shop-pin-container').style.display = mode === 'app' ? 'block' : 'none';
};

window.confirmerAchatShop = function(vendeurKey, produitId, produitNom, prix) {
    const pin = document.getElementById('shop-pin')?.value;
    const paiement = _paiementChoisi;
    if (paiement === 'app') {
        if (!pin) return toast("PIN requis pour le paiement via l'app", 'var(--red)');
        if (!checkPin(pin)) return toast("PIN incorrect", 'var(--red)');
    }
    const myKey = dbKey(myPhone);
    if (paiement === 'app') {
        db.ref('users/' + myKey + '/solde').once('value', s => {
            const solde = s.val() || 0;
            if (solde < prix) return toast("Solde insuffisant", 'var(--red)');
            db.ref('users/' + myKey + '/solde').set(solde - prix);
            db.ref('users/' + myKey + '/solde_bloque').transaction(v => (v || 0) + prix);
            envoyerCommandeShop(vendeurKey, produitId, produitNom, prix, 'app');
        });
    } else {
        envoyerCommandeShop(vendeurKey, produitId, produitNom, prix, 'cash');
    }
};

window.envoyerCommandeShop = function(vendeurKey, produitId, produitNom, prix, paiement) {
    const myKey = dbKey(myPhone);
    db.ref('boutiques/' + vendeurKey).once('value', snap => {
        const b = snap.val();
        if (!b) return toast("Boutique introuvable", 'var(--red)');
        db.ref('shop_commandes').push({
            client: me.name, clientPhone: myKey,
            vendeur: vendeurKey, vendeurNom: b.proprietaire || "Vendeur",
            produitId: produitId, produitNom: produitNom,
            prix: prix, paiement: paiement,
            statut: paiement === 'app' ? 'escrow' : 'en_attente',
            date: Date.now(), expedie: false, recu: false, litige: false
        }).then(ref => {
            const numConf = 'IK' + Date.now().toString().slice(-6) + Math.random().toString(36).substring(2, 5).toUpperCase();
            db.ref('boutiques/' + vendeurKey + '/produits/' + produitId + '/stock').transaction(v => {
                const nouveau = (v || 1) - 1;
                return nouveau >= 0 ? nouveau : 0;
            });
            logHistory(myKey, '🛍️ ACHAT SHOP (' + produitNom + ')', -prix);
            envoyerNotification(vendeurKey, {
                type: 'shop_commande', titre: '🛍️ Nouvelle commande !',
                message: `${me.name} a acheté "${produitNom}" pour ${prix.toLocaleString()} CFA.\n📌 ${paiement === 'cash' ? 'Paiement en cash à la livraison' : 'Paiement via l\'app'}\n📌 Confirmation : ${numConf}`,
                date: Date.now(), lu: false, confirmation: numConf, commandeId: ref.key
            });
            toast(`✅ Commande passée ! ${paiement === 'cash' ? 'Paiement en cash à la livraison' : 'Paiement via l\'app'}\n📌 Confirmation : ${numConf}`);
            chargerMesCommandesShop();
            closeModal();
        });
    });
};

window.chargerMesCommandesShop = function() {
    const myKey = dbKey(myPhone);
    db.ref('shop_commandes').orderByChild('clientPhone').equalTo(myKey).on('value', snap => {
        const div = document.getElementById('shop-produits-list');
        if (!div) return;
        if (!snap.exists()) {
            div.innerHTML = '<p style="color:var(--sub);font-size:11px;text-align:center;">Aucune commande</p>';
            return;
        }
        let html = '<h4 style="color:var(--gold);font-size:11px;margin:8px 0;">📦 MES COMMANDES</h4>';
        snap.forEach(c => {
            const d = c.val();
            const statut = d.statut || 'en_attente';
            const paiementLabel = d.paiement === 'app' ? '📱 App' : '💵 Cash';
            html += `<div class="course-item" style="border-left:3px solid ${statut === 'recu' ? 'var(--green)' : statut === 'expedie' ? 'var(--info)' : 'var(--gold)'};">
                <div style="flex:1;">
                    <div style="font-weight:700;">${escapeHtml(d.produitNom)}</div>
                    <div style="font-size:10px;color:var(--sub);">${statutLabel(statut)} · ${paiementLabel}</div>
                    <div class="num" style="color:var(--gold);font-weight:700;">${d.prix.toLocaleString()} CFA</div>
                    ${d.statut === 'expedie' && !d.recu && d.paiement === 'app' ? `<div style="display:flex;gap:4px;margin-top:4px;">
                        <button onclick="clientConfirmeReceptionShop('${c.key}','${d.vendeur}','${d.prix}')" class="btn btn-xs btn-primary">✅ J'ai reçu</button>
                        <button onclick="clientSignaleLitigeShop('${c.key}')" class="btn btn-xs btn-danger">❌ Pas reçu</button>
                    </div>` : ''}
                    ${d.statut === 'escrow' ? `<button onclick="annulerAchatShop('${c.key}')" class="btn btn-xs btn-outline" style="margin-top:4px;">❌ Annuler</button>` : ''}
                </div>
            </div>`;
        });
        div.innerHTML = html;
    });
};

window.vendeurMarqueExpedie = function(commandeId, clientPhone, prix) {

            message: `Le vendeur a expédié votre commande de ${prix.toLocaleString()} CFA.${prix ? ' Confirmez la réception pour débloquer l\'argent.' : ''}`,

        });

window.clientConfirmeReceptionShop = function(commandeId, vendeurKey, prix) {
    if (!confirm("✅ Avez-vous bien reçu la commande ?")) return;
    const gainVendeur = calculerGainPrestataire(prix);
    const commission = calculerCommissionPlateforme(prix);
    db.ref('shop_commandes/' + commandeId).update({ statut: 'recu', dateReception: Date.now(), recu: true }).then(() => {
        db.ref('users/' + vendeurKey + '/solde').transaction(v => (v || 0) + gainVendeur);
        db.ref('users/' + dbKey(ADMIN) + '/solde').transaction(v => (v || 0) + commission);
        logHistory(vendeurKey, '🛍️ VENTE SHOP', gainVendeur);
        logHistory(dbKey(ADMIN), '💸 COMMISSION SHOP', commission);
        envoyerNotification(vendeurKey, {
            type: 'shop_recu', titre: '✅ Commande reçue !',
            message: `Le client a confirmé la réception. ${gainVendeur.toLocaleString()} CFA débloqués.`,
            date: Date.now(), lu: false
        });
        toast(`✅ Confirmation reçue ! ${gainVendeur.toLocaleString()} CFA débloqués pour le vendeur`);
        db.ref('users/' + vendeurKey).once('value', snap => {
            const u = snap.val();
            if (u) {
                demanderEvaluation('🛍️ IkaShop', vendeurKey, u.name || 'Vendeur', commandeId);
            }
        });
        openShop();
    });
};

window.clientSignaleLitigeShop = function(commandeId) {

    db.ref('shop_commandes/' + commandeId).update({ statut: 'litige', dateLitige: Date.now(), litige: true }).then(() => {
        envoyerNotification(dbKey(ADMIN), { type: 'litige_shop', titre: '🚨 Litige IkaShop',
            message: `${me.name} signale ne pas avoir reçu sa commande.`, date: Date.now(), lu: false });
        toast("📨 Litige signalé !");
        openShop();
    });
};

window.annulerAchatShop = function(commandeId) {
    if (!confirm("❌ Annuler votre achat avant expédition ?")) return;
    db.ref('shop_commandes/' + commandeId).once('value', snap => {
        const d = snap.val();
        if (!d) return toast("Commande introuvable", 'var(--red)');
        if (d.statut !== 'escrow') return toast("Cette commande a déjà été expédiée", 'var(--red)');
        db.ref('users/' + dbKey(myPhone) + '/solde').transaction(v => (v || 0) + d.prix);
        db.ref('users/' + dbKey(myPhone) + '/solde_bloque').transaction(v => Math.max(0, (v || 0) - d.prix));
        db.ref('boutiques/' + d.vendeur + '/produits/' + d.produitId + '/stock').transaction(v => (v || 0) + 1);
        db.ref('shop_commandes/' + commandeId).update({ statut: 'annule', dateAnnulation: Date.now() }).then(() => {
            toast("✅ Achat annulé et remboursé");
            chargerMesCommandesShop();
        });
    });
};

window.rechercherShop = function() {
    const query = document.getElementById('shop-search').value.toLowerCase().trim();
    if (!query) { chargerBoutiques(); return; }
    const div = document.getElementById('shop-boutiques-list');
    if (!div) return;
    div.innerHTML = '<div class="loom-loader"><span></span><span></span><span></span><span></span><span></span></div>';
    db.ref('boutiques').once('value', snap => {
        div.innerHTML = '';
        let count = 0;
        if (snap.exists()) {
            snap.forEach(c => {
                const b = c.val();
                const vendeurKey = c.key;
                const nbProduits = Object.keys(b.produits || {}).length;
                if (nbProduits === 0) return;
                const nomMatch = b.nom.toLowerCase().includes(query);
                const catMatch = (b.categorie || '').toLowerCase().includes(query);
                const descMatch = (b.description || '').toLowerCase().includes(query);
                const propMatch = (b.proprietaire || '').toLowerCase().includes(query);
                if (!nomMatch && !catMatch && !descMatch && !propMatch) return;
                count++;
                div.innerHTML += `<div class="boutique-card" onclick="voirBoutique('${vendeurKey}')">
                    <div class="flex-between">
                        <div class="nom">${escapeHtml(b.nom)}</div>
                        <span class="badge-pro">${nbProduits} produits</span>
                    </div>
                    <div class="desc">${escapeHtml(b.categorie || '')} · ${escapeHtml(b.description || '')}</div>
                    <div style="font-size:10px;color:var(--sub);">🛒 ${escapeHtml(b.proprietaire)}</div>
                </div>`;
            });
        }
        if (count === 0) div.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub);font-size:12px;">🔍 Aucun résultat</div>';
    });
};

window.confirmerCommandeFood = function(restoKey, platId, platNom, prix) {
    const pin = document.getElementById('food-pin')?.value;
    const paiement = _paiementChoisi;
    if (paiement === 'app') {
        if (!pin) return toast("PIN requis pour le paiement via l'app", 'var(--red)');
        if (!checkPin(pin)) return toast("PIN incorrect", 'var(--red)');
    }
    const myKey = dbKey(myPhone);
    db.ref('restaurants/' + restoKey).once('value', snap => {
        const r = snap.val();
        if (!r) return toast("Restaurant introuvable", 'var(--red)');
        if (paiement === 'app') {
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < prix) return toast("Solde insuffisant", 'var(--red)');
                db.ref('users/' + myKey + '/solde').set(solde - prix);
                db.ref('users/' + myKey + '/solde_bloque').transaction(v => (v || 0) + prix);
                envoyerCommandeFood(restoKey, platId, platNom, prix, paiement, r);
            });
        } else {
            envoyerCommandeFood(restoKey, platId, platNom, prix, paiement, r);
        }
    });
};

window.commanderGrossiste = function(offreId, titre, prix) {
    const pin = prompt(`📦 Commander "${titre}" pour ${prix.toLocaleString()} CFA ?\n\nEntrez votre PIN pour confirmer :`);
    if (pin === null) return;
    if (!checkPin(pin)) return toast("PIN incorrect", 'var(--red)');
    const myKey = dbKey(myPhone);
    db.ref('grossiste_offres/' + offreId).once('value', snap => {
        const o = snap.val();
        if (!o) return toast("Offre introuvable", 'var(--red)');
        if (o.stock < 1) return toast("Stock épuisé", 'var(--red)');
        db.ref('users/' + myKey + '/solde').once('value', s => {
            const solde = s.val() || 0;
            if (solde < prix) return toast("Solde insuffisant", 'var(--red)');
            db.ref('users/' + myKey + '/solde').set(solde - prix);
            db.ref('users/' + myKey + '/solde_bloque').transaction(v => (v || 0) + prix);
            db.ref('grossiste_offres/' + offreId + '/stock').transaction(v => {
                const nouveau = (v || 1) - 1;
                return nouveau >= 0 ? nouveau : 0;
            });
            db.ref('grossiste_commandes').push({
                client: me.name, clientPhone: myKey,
                offreId: offreId, titre: titre,
                prix: prix, vendeur: o.vendeur, vendeurPhone: o.vendeurPhone,
                statut: 'en_attente', date: Date.now(),
                expedie: false, recu: false, litige: false
            }).then(ref => {
                const numConf = 'IK' + Date.now().toString().slice(-6) + Math.random().toString(36).substring(2, 5).toUpperCase();
                logHistory(myKey, '📦 COMMANDE GROSSISTE (' + titre + ')', -prix);
                envoyerNotification(o.vendeurPhone, {
                    type: 'grossiste_commande', titre: '📦 Nouvelle commande en gros !',
                    message: `${me.name} a commandé "${titre}" pour ${prix.toLocaleString()} CFA.\n📌 Confirmation : ${numConf}`,
                    date: Date.now(), lu: false, confirmation: numConf, commandeId: ref.key
                });
                toast(`✅ Commande passée ! ${prix.toLocaleString()} CFA bloqués\n📌 Confirmation : ${numConf}`);
                closeModal();
                openGrossiste();
                voirOffresGrossiste();
            });
        });
    });
};

window.rechercherLieu = function() {
    const query = document.getElementById('map-search').value.toLowerCase().trim();
    const lieux = document.getElementById('map-lieux-utilisateurs');
    if (!lieux) return;
    const items = lieux.querySelectorAll('.boutique-card');
    items.forEach(item => {
        const nom = item.querySelector('.nom')?.textContent?.toLowerCase() || '';
        const desc = item.querySelector('.desc')?.textContent?.toLowerCase() || '';
        const match = nom.includes(query) || desc.includes(query) || !query;
        item.style.display = match ? 'block' : 'none';
    });
};

window.startNotifications = function() {
    const myKey = dbKey(myPhone);
    db.ref('notifications/' + myKey).orderByChild('lu').equalTo(false).on('value', s => {
        const badge = document.getElementById('notif-badge');
        if (!badge) return;
        const count = s.exists() ? s.numChildren() : 0;
        badge.innerText = count;
        badge.classList.toggle('hidden', count === 0);
        if (s.exists()) {
            s.forEach(c => {
                const n = c.val();
                if (!n.lu && !n.popup_shown) {
                    db.ref('notifications/' + myKey + '/' + c.key + '/popup_shown').set(true);
                    if (n.type === 'retrait_guichet_demande' && n.statut === 'en_attente_confirmation') {
                        toast(`💸 ${n.message}`, 'var(--info)');
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('💸 Demande de retrait guichet', {
                                body: `${n.agent} demande à vous retirer ${n.montant.toLocaleString()} CFA`,
                                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💸</text></svg>'
                            });
                        }
                        setTimeout(() => {
                            if (document.getElementById('ui-modal').style.display === 'none') {
                                openModal("💸 CONFIRMER LE RETRAIT");
                                document.getElementById('modal-content').innerHTML = `
                                    <div class="card card-gold">
                                        <h3 style="color:var(--gold);">💸 Demande de retrait guichet</h3>
                                        <p style="font-size:14px;font-weight:700;">Montant : ${n.montant.toLocaleString()} CFA</p>
                                        <p style="font-size:12px;color:var(--sub);">Agent : ${n.agent} (${n.agentPhone})</p>
                                        <p style="font-size:11px;color:var(--red);margin:10px 0;">⚠️ Confirmez-vous ce retrait ?</p>
                                        <div class="grid-2">
                                            <button onclick="confirmerRetraitGuichet('${c.key}',${n.montant},'${n.agentPhone}','${n.agent}')" class="btn btn-primary">✅ OUI, CONFIRMER</button>
                                            <button onclick="closeModal()" class="btn btn-outline">❌ ANNULER</button>
                                        </div>
                                    </div>
                                `;
                            }
                        }, 500);
                    } else if (n.type === 'shop_commande' || n.type === 'food_commande' || n.type === 'grossiste_commande') {
                        toast(`🛍️ ${n.message}`, 'var(--purple)');
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('📦 Nouvelle commande', {
                                body: n.message,
                                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📦</text></svg>'
                            });
                        }
                    } else if (n.type === 'nouvelle_evaluation') {
                        toast(`⭐ ${n.message}`, 'var(--gold)');
                    } else {
                        toast(`🔔 ${n.message}`);
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification(n.titre || 'IKAPAY', {
                                body: n.message,
                                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🇲🇱</text></svg>'
                            });
                        }
                    }
                }
            });
        }
    });
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
};

window.openNotifications = function() {
    openModal("🔔 NOTIFICATIONS");
    const myKey = dbKey(myPhone);
    db.ref('notifications/' + myKey).orderByChild('date').limitToLast(30).once('value', snap => {
        const div = document.getElementById('modal-content');
        if (!snap.exists()) { div.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub);">🔔 Aucune notification</div>'; return; }
        let html = '<button class="btn btn-sm btn-outline" onclick="marquerToutLu()" style="margin-bottom:8px;">✅ Tout marquer comme lu</button>';
        snap.forEach(c => {
            const n = c.val();
            let actionBtn = '';
            if (n.type === 'retrait_guichet_demande' && n.statut === 'en_attente_confirmation' && !n.lu) {
                actionBtn = `<button onclick="confirmerRetraitGuichet('${c.key}',${n.montant},'${n.agentPhone}','${n.agent}')" class="btn btn-xs btn-primary" style="margin-top:4px;">✅ Confirmer le retrait</button>`;
            }
            if ((n.type === 'shop_commande' || n.type === 'food_commande' || n.type === 'grossiste_commande') && !n.lu) {
                const actionFn = n.type === 'shop_commande' ? `vendeurMarqueExpedie('${n.commandeId}','${myKey}',${n.montant || 0})` :
                    n.type === 'food_commande' ? `restaurateurMarquePrete('${n.commandeId}','${myKey}',${n.montant || 0})` :
                    `grossisteMarqueExpedie('${n.commandeId}','${myKey}',${n.montant || 0})`;
                const btnText = n.type === 'shop_commande' ? '📦 Expédier' : n.type === 'food_commande' ? '🍽️ Préparer' : '📦 Expédier';
                actionBtn = `<button onclick="${actionFn}" class="btn btn-xs btn-purple" style="margin-top:4px;">${btnText}</button>`;
            }
            html += `<div class="historique-item" style="${n.lu ? 'opacity:0.6;' : ''}border-left-color:${n.lu ? 'var(--sub)' : 'var(--gold)'};">
                <div style="font-weight:700;">${escapeHtml(n.titre || 'Notification')}</div>
                <div style="font-size:10px;color:var(--sub);">${escapeHtml(n.message)}</div>
                ${n.confirmation ? `<div style="font-size:9px;color:var(--gold);font-weight:700;">📌 ${n.confirmation}</div>` : ''}
                <div style="font-size:8px;color:var(--sub);margin-top:2px;">${new Date(n.date).toLocaleString('fr-FR')}</div>
                ${actionBtn}
                ${!n.lu && !actionBtn ? `<button onclick="marquerLuNotification('${c.key}')" class="btn btn-xs btn-primary" style="margin-top:4px;">✅ Marquer lu</button>` : ''}
            </div>`;
        });
        div.innerHTML = html;
    });
};

window.sauvegarderPlat = function() {
    const nom = document.getElementById('plat-nom').value.trim();
    const prix = parseInt(document.getElementById('plat-prix').value);
    const desc = document.getElementById('plat-desc').value.trim();
    const imagePreview = document.getElementById('plat-image-preview');
    if (!nom || !prix || prix < 100) return toast("Nom et prix requis (min 100 CFA)", 'var(--red)');
    const data = { nom, prix, description: desc || '', date: Date.now() };
    if (imagePreview.querySelector('img')) {
        data.image = imagePreview.querySelector('img').src;
    }
    const myKey = dbKey(myPhone);

        </div>

window.vosCommandesGrossiste = function() {
    openModal("📋 MES COMMANDES GROSSISTE");
    const myKey = dbKey(myPhone);
    db.ref('grossiste_commandes').orderByChild('vendeurPhone').equalTo(myKey).once('value', snap => {
        const div = document.getElementById('modal-content');
        if (!snap.exists()) {
            div.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub);">📋 Aucune commande</div>';
            return;
        }
        let html = '';
        snap.forEach(c => {
            const d = c.val();
            html += `<div class="course-item" style="border-left:3px solid var(--purple);">
                <div style="flex:1;">
                    <div style="font-weight:700;">📦 ${escapeHtml(d.titre)}</div>
                    <div style="font-size:10px;color:var(--sub);">${statutLabel(d.statut)}</div>
                    <div class="num" style="color:var(--gold);font-weight:700;">${d.prix.toLocaleString()} CFA</div>
                    <div style="font-size:9px;color:var(--sub);">👤 ${escapeHtml(d.client)}</div>
                    ${d.statut === 'en_attente' ? `<button onclick="grossisteMarqueExpedie('${c.key}','${d.clientPhone}','${d.prix}')" class="btn btn-xs btn-gros" style="margin-top:4px;">📦 Expédier</button>` : ''}
                    ${d.statut === 'expedie' ? `<span style="font-size:9px;color:var(--info);">⏳ En attente de confirmation</span>` : ''}
                    ${d.statut === 'termine' ? `<span style="font-size:9px;color:var(--green);">✅ Terminé</span>` : ''}
                </div>
            </div>`;
        });
        div.innerHTML = html;
    });
};

window.grossisteMarqueExpedie = function(commandeId, clientPhone, prix) {
    if (!confirm("📦 Confirmer que vous avez expédié la commande ?")) return;
    db.ref('grossiste_commandes/' + commandeId).update({ statut: 'expedie', dateExpedition: Date.now(), expedie: true }).then(() => {
        envoyerNotification(clientPhone, {
            type: 'grossiste_expedie', titre: '📦 Commande expédiée !',
            message: `Le grossiste a expédié votre commande. Confirmez la réception pour débloquer l'argent.`,
            date: Date.now(), lu: false
        });
        toast("✅ Commande marquée comme expédiée");
        vosCommandesGrossiste();
    });
};

window.openHistory = function() {
    document.getElementById('section-home').classList.add('hidden');
    openModal("📋 HISTORIQUE");
    const myKey = dbKey(myPhone);
    db.ref('user_history/' + myKey).limitToLast(40).once('value', s => {
        const content = document.getElementById('modal-content');
        if (!s.exists()) { content.innerHTML = '<div style="text-align:center;color:var(--sub);padding:30px;">📋 Aucune transaction.</div>'; return; }
        const items = [];
        s.forEach(c => items.unshift({ id: c.key, ...c.val() }));
        content.innerHTML = `
            <div class="flex-between" style="margin-bottom:8px;">
                <span style="font-size:11px;color:var(--sub);">${items.length} transactions</span>
                <button onclick="effacerHistorique('${myKey}')" class="btn btn-sm btn-danger">🗑️ Effacer</button>
            </div>
            ${items.map(h => {
                const amt = Number(h.amt||0);
                const color = amt>0 ? 'var(--green)' : 'var(--red)';
                return `<div class="historique-item ${h.type && h.type.includes('REMBOURSEMENT') ? 'rembourse' : ''}">
                    <div style="font-weight:700;">${escapeHtml(h.type)||'Transaction'}</div>
                    <div style="font-size:9px;color:var(--sub);">${escapeHtml(h.date)||''}</div>
                    <div class="num" style="font-weight:700;color:${color};">${amt>0?'+':''}${amt.toLocaleString('fr-FR')} CFA</div>
                </div>`;
            }).join('')}
        `;
    });
};

window.effacerHistorique = function(key) {
    if (!confirm("⚠️ Supprimer tout l'historique ?")) return;
    db.ref('user_history/' + key).remove().then(() => toast("🗑️ Historique effacé"));
};

window.changerAvatar = function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function() {
        const f = this.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = e => {
            db.ref('users/' + dbKey(myPhone) + '/avatar').set(e.target.result).then(() => {
                toast("✅ Photo mise à jour");
                openProfile();
            });
        };
        r.readAsDataURL(f);
    };
    input.click();
};

window.saveProfile = function() {
    const newName = document.getElementById('edit-name').value.trim();
    const oldPin = document.getElementById('old-pin').value;
    const newPin = document.getElementById('new-pin').value;
    if (!newName) return toast("Nom vide", 'var(--red)');
    if (!checkPin(oldPin)) return toast("PIN incorrect", 'var(--red)');
    const updates = { name: newName };
    if (newPin) updates.pin = newPin;
    db.ref('users/' + dbKey(myPhone)).update(updates).then(() => {
        me.name = newName;
        if (newPin) me.pin = newPin;
        document.getElementById('disp-name').innerText = me.name;
        toast("✅ Profil mis à jour");
        closeModal();
    });
};

window.sendLitige = function() {
    const sujet = document.getElementById('lit-sujet').value.trim();
    const desc = document.getElementById('lit-desc').value.trim();
    const type = document.getElementById('lit-type').value;
    const amt = document.getElementById('lit-amt').value || 0;
    if (!sujet || !desc) return toast("Remplis sujet et description", 'var(--red)');
    db.ref('litiges').push({ phone: myPhone, name: me.name, sujet, desc, type, amt: Number(amt),
        date: Date.now(), statut: 'ouvert' }).then(() => {
        toast("📨 Litige signalé !");
        closeModal();
        envoyerNotification(dbKey(ADMIN), { type: 'litige_client', titre: '🚨 Nouveau litige',
            message: `${me.name} signale : ${sujet}`, date: Date.now(), lu: false });
    });
};
