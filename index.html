<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKAPAY — Mali 🇲🇱</title>
    <meta name="theme-color" content="#0c130c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="IKAPAY">
    <meta name="application-name" content="IKAPAY">
    <meta name="description" content="IKAPAY - Paiement mobile au Mali">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js">
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Outfit', sans-serif;
        }

        :root {
            --green: #18b955;
            --green-dark: #0e7a39;
            --gold: #fbd013;
            --red: #e0203a;
            --info: #3aa0ff;
            --pink: #C1440E;
            --orange: #f59e0b;
            --purple: #8B5CF6;
            --blue: #5c6dff;
            --bg: #080b08;
            --bg-soft: #0d120d;
            --card: #12170f;
            --card2: #181f16;
            --border: #232b20;
            --text: #f2f4ee;
            --sub: #8a9686;
            --sub-dim: #6b7a70;
            --radius: 18px;
            --radius-sm: 13px;
            --tricolor: linear-gradient(90deg, var(--green), var(--gold) 50%, var(--red));
            --shadow: 0 4px 20px rgba(0, 0, 0, .3);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, .2);
        }

        [data-theme="light"] {
            --bg: #f5f5f0;
            --bg-soft: #e8e8e0;
            --card: #ffffff;
            --card2: #f0f0e8;
            --border: #d0d0c8;
            --text: #1a1a12;
            --sub: #6a7a66;
            --sub-dim: #8a9a86;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        body {
            padding: 12px;
            padding-bottom: 84px;
            background: radial-gradient(circle at 10% 0%, rgba(24, 185, 85, .08), transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(251, 208, 19, .05), transparent 40%),
                var(--bg);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-soft);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 10px;
        }

        .num {
            font-family: 'Space Grotesk', monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.2px;
        }

        /* ===== LOADER ===== */
        .loom-loader {
            display: flex;
            gap: 5px;
            justify-content: center;
            padding: 24px 0;
        }
        .loom-loader span {
            width: 7px;
            height: 7px;
            border-radius: 2px;
            background: var(--green);
            animation: loomWeave 1.1s ease-in-out infinite;
        }
        .loom-loader span:nth-child(2) {
            background: var(--gold);
            animation-delay: .15s;
        }
        .loom-loader span:nth-child(3) {
            background: var(--red);
            animation-delay: .3s;
        }
        .loom-loader span:nth-child(4) {
            background: var(--gold);
            animation-delay: .45s;
        }
        .loom-loader span:nth-child(5) {
            background: var(--green);
            animation-delay: .6s;
        }
        @keyframes loomWeave {
            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: .5;
            }
            50% {
                transform: translateY(-6px) scale(1.15);
                opacity: 1;
            }
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            transition: background 0.3s;
        }
        .card-accent {
            border: 1px solid rgba(24, 185, 85, .35);
        }
        .card-gold {
            border: 1px solid rgba(251, 208, 19, .4);
        }
        .card-danger {
            border: 1px solid rgba(224, 32, 58, .4);
        }
        .card-info {
            border: 1px solid rgba(58, 160, 255, .4);
        }
        .card-pink {
            border: 1px solid rgba(193, 68, 14, .4);
        }
        .card-purple {
            border: 1px solid rgba(139, 92, 246, .4);
        }
        .card-food {
            border: 1px solid rgba(245, 158, 11, .4);
        }
        .card-gros {
            border: 1px solid rgba(139, 92, 246, .4);
        }

        /* ===== MODULE HEADER ===== */
        .module-header {
            padding: 16px 14px 14px;
            border-radius: 16px;
            text-align: center;
            color: #fff;
            margin-bottom: 9px;
            position: relative;
            overflow: hidden;
        }
        .module-header h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
        }
        .module-header p {
            font-size: 11px;
            opacity: .88;
            margin: 3px 0 0;
        }
        .module-header .tags {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 7px;
        }
        .module-header .tags span {
            background: rgba(255, 255, 255, .16);
            padding: 2px 11px;
            border-radius: 20px;
            font-size: 8.5px;
            font-weight: 600;
        }

        /* ===== INPUTS ===== */
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            margin: 5px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            outline: none;
            font-size: 13.5px;
            transition: border 0.3s, background 0.3s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--green);
        }
        textarea {
            min-height: 70px;
            resize: vertical;
        }
        ::placeholder {
            color: var(--sub);
        }

        /* ===== BUTTONS ===== */
        .btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform .15s, opacity .15s, background 0.3s;
            color: #fff;
        }
        .btn:active {
            transform: scale(.96);
            opacity: .88;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #04140a;
        }
        .btn-gold {
            background: linear-gradient(135deg, #ffe25c, var(--gold));
            color: #241a00;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff4d63, var(--red));
        }
        .btn-info {
            background: linear-gradient(135deg, #5cb6ff, var(--info));
        }
        .btn-pink {
            background: linear-gradient(135deg, #E2896B, var(--pink));
        }
        .btn-nego {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }
        .btn-sm {
            padding: 7px 14px;
            font-size: 11.5px;
            border-radius: 20px;
            width: auto;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 10px;
            border-radius: 16px;
            width: auto;
        }
        .btn-purple {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #fff;
        }
        .btn-shop {
            background: linear-gradient(135deg, #5c6dff, #2d3ba8);
            color: #fff;
        }
        .btn-gros {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            color: #fff;
        }
        .btn-food {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }
        .btn-map {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
        }

        /* ===== GRIDS ===== */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }

        /* ===== FLEX ===== */
        .flex {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }

        /* ===== BADGES ===== */
        .badge {
            font-size: 9.5px;
            padding: 3px 11px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-block;
        }
        .badge-admin {
            color: var(--red);
            border: 1px solid var(--red);
        }
        .badge-agent {
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .badge-rating {
            color: var(--gold);
            border: 1px solid var(--gold);
            background: rgba(251, 208, 19, .1);
        }
        .badge-fee {
            background: var(--green);
            color: #04140a;
            padding: 4px 13px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 900;
            display: inline-block;
            animation: pulse 2.4s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.045);
            }
        }

        /* ===== SOLDE ===== */
        .solde-wrap {
            text-align: center;
            padding: 6px 0 2px;
        }
        .solde-label {
            font-size: 9.5px;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }
        .solde-amt {
            font-family: 'Space Grotesk', monospace;
            font-size: 30px;
            font-weight: 700;
            color: var(--green);
            margin: 3px 0;
            letter-spacing: -.5px;
        }

        /* ===== SERVICES BUTTONS ===== */
        .service-btn {
            height: 80px;
            flex-direction: column;
            border-radius: 16px !important;
            font-size: 10.5px;
            font-weight: 700;
            gap: 5px;
            color: #fff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px;
            transition: transform .15s;
            box-shadow: var(--shadow);
        }
        .service-btn:active {
            transform: scale(.95);
        }
        .service-btn span {
            font-size: 24px;
        }
        .service-btn-chat {
            background: linear-gradient(135deg, #3aa0ff, #1d6fc9);
        }
        .service-btn-taxi {
            background: linear-gradient(135deg, #ff4d63, var(--red));
        }
        .service-btn-livreur {
            background: linear-gradient(135deg, #ff9a3d, #e06a00);
        }
        .service-btn-retrait {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
        }
        .service-btn-shop {
            background: linear-gradient(135deg, #5c6dff, #2d3ba8);
        }
        .service-btn-grossiste {
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
        }
        .service-btn-food {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .service-btn-map {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        /* ===== COURSE ITEMS ===== */
        .course-item {
            background: var(--card2);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border: 1px solid var(--border);
            font-size: 12px;
            gap: 8px;
        }

        /* ===== HISTORIQUE ===== */
        .historique-item {
            background: var(--card2);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 5px;
            border-left: 3px solid var(--sub);
            font-size: 11.5px;
        }
        .historique-item.rembourse {
            border-left-color: var(--green);
        }
        .historique-item.litige {
            border-left-color: var(--red);
        }

        /* ===== NOTIFICATIONS ===== */
        .notif-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            width: 17px;
            height: 17px;
            font-size: 9.5px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        /* ===== MODAL ===== */
        .modal-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 5000;
            padding: 16px;
            overflow-y: auto;
            display: none;
            animation: slideUp .28s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(24px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-close {
            font-size: 26px;
            color: var(--red);
            cursor: pointer;
            line-height: 1;
        }

        /* ===== NAV ===== */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-soft);
            display: flex;
            justify-content: space-around;
            padding: 6px 0 12px;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-btn {
            font-size: 9px;
            color: var(--sub);
            cursor: pointer;
            text-align: center;
            flex: 1;
            line-height: 1.5;
            transition: color .2s;
        }
        .nav-btn span {
            font-size: 19px;
            display: block;
        }
        .nav-btn.active {
            color: var(--green);
            font-weight: 700;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 82px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--green);
            color: #04140a;
            padding: 9px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 12.5px;
            z-index: 9999;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .4);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== CHAT STYLES ===== */
        .wa-conv-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .wa-conv-item:active {
            background: var(--card2);
            border-radius: 12px;
        }
        .wa-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
        }
        .wa-conv-preview {
            font-size: 10.5px;
            color: var(--sub);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }
        .wa-conv-time {
            font-size: 8.5px;
            color: var(--sub);
        }
        .wa-conv-name {
            font-weight: 700;
            font-size: 12.5px;
        }

        .wa-chat-header {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 12px;
            background: var(--card2);
            border-bottom: 1px solid var(--border);
        }
        .wa-chat-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #04140a;
            flex-shrink: 0;
            background: var(--green);
        }
        .wa-chat-name {
            font-weight: 700;
            font-size: 13.5px;
        }
        .wa-chat-status {
            font-size: 8.5px;
            color: var(--sub);
        }
        .wa-chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-soft);
            height: 100%;
            scroll-behavior: smooth;
        }
        .wa-msg {
            padding: 7px 13px;
            border-radius: 12px;
            font-size: 12.5px;
            line-height: 1.35;
            word-break: break-word;
            max-width: 78%;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .wa-msg.me {
            align-self: flex-end;
            background: #0f4a2c;
            color: #fff;
            border-radius: 12px 12px 3px 12px;
        }
        .wa-msg.other {
            align-self: flex-start;
            background: var(--card2);
            color: var(--text);
            border-radius: 12px 12px 12px 3px;
        }
        .wa-msg.auto {
            align-self: center;
            background: rgba(251, 208, 19, 0.15);
            color: var(--gold);
            border-radius: 12px;
            font-size: 11px;
            max-width: 90%;
            border: 1px solid rgba(251, 208, 19, 0.2);
        }
        .wa-msg.payement {
            background: linear-gradient(135deg, #0f4a2c, #0e7a39);
            font-weight: 700;
        }
        .wa-msg-time {
            font-size: 8.5px;
            color: var(--sub-dim);
            margin-top: 2px;
            padding: 0 4px;
        }
        .wa-date-separator {
            text-align: center;
            font-size: 10px;
            color: var(--sub);
            padding: 8px 0;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .wa-chat-footer {
            padding: 8px 10px;
            background: var(--card2);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .wa-chat-footer input {
            flex: 1;
            margin: 0;
            border-radius: 24px;
            padding: 8px 14px;
            border: 1.5px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            outline: none;
            font-size: 13px;
        }
        .wa-chat-footer input:focus {
            border-color: var(--green);
        }
        .wa-chat-footer .btn-send {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--green);
            border: none;
            color: #04140a;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }
        .wa-chat-footer .btn-send:active {
            transform: scale(.9);
        }
        .wa-chat-footer .btn-pay {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            padding: 0;
            background: var(--green);
            font-size: 14px;
            border: none;
            color: #04140a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== VEHICULE ===== */
        .vehicule-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }
        .vehicule-selector .v-btn {
            padding: 8px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--card2);
            color: var(--text);
            cursor: pointer;
            text-align: center;
            font-size: 10px;
            transition: all .2s;
        }
        .vehicule-selector .v-btn.active {
            border-color: var(--green);
            background: rgba(24, 185, 85, .13);
        }
        .vehicule-selector .v-btn .icon {
            font-size: 21px;
            display: block;
        }

        /* ===== PROFILE ===== */
        .profile-avatar-wrap {
            position: relative;
            width: 76px;
            height: 76px;
            margin: 0 auto 8px;
        }
        .profile-avatar-img {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--green);
        }
        .profile-avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--green);
            border-radius: 50%;
            width: 23px;
            height: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            border: 2px solid var(--bg);
        }

        /* ===== OTHERS ===== */
        .delai-tag {
            background: rgba(224, 32, 58, .15);
            border: 1px solid var(--red);
            border-radius: 20px;
            padding: 1px 9px;
            font-size: 8.5px;
            color: var(--red);
            display: inline-block;
        }
        .admin-stat {
            background: var(--card2);
            border-radius: 12px;
            padding: 11px;

// SANITIZE RENFORCÉ

function sanitizeInput(input) {
    if (!input) return '';
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
        '/': '&#x2F;',
        '`': '&#x60;',
        '=': '&#x3D;'
    };
    return String(input).replace(/[&<>"'/`=]/g, function(s) {
        return map[s];
    });
}

function escapeHtml(s) {
    return sanitizeInput(s);
}

// ============================================================

// ============================================================

// ============================================================
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    if (current === 'light') {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
    } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    }
}
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
}

// ============================================================
// UTILITAIRES

function dbKey(p) { return (p || '').replace(/\+/g, '').replace(/\s/g, ''); }

function normalizePhone(p) {
    let r = (p || '').trim().replace(/\s/g, '');
    if (r.startsWith('00223')) r = '+223' + r.slice(5);
    else if (r.startsWith('223') && !r.startsWith('+')) r = '+' + r;
    else if (!r.startsWith('+') && r.length === 8) r = '+223' + r;
    else if (!r.startsWith('+') && r.length === 11 && r.startsWith('223')) r = '+' + r;
    return r;
}

function isAdminPhone(p) { const c = dbKey(p); return c === dbKey(ADMIN); }

function toast(msg, color) {
    const t = document.getElementById('toast');
    t.style.background = color || 'var(--green)';
    t.style.color = color ? '#fff' : '#04140a';
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(t._to);
    t._to = setTimeout(() => t.classList.remove('show'), 2600);
}

function openModal(title) {
    document.getElementById('ui-modal').style.display = 'block';
    document.getElementById('modal-title').style.display = 'block';
    document.getElementById('modal-title').innerText = title;
}

function closeModal() {
    // Nettoyer audio
    if (_isRecording && _mediaRecorder) {
        try {
            _mediaRecorder.stop();
            _isRecording = false;
            clearInterval(_recordingTimer);
            const stopBtn = document.getElementById('stop-recording-btn');
            if (stopBtn) stopBtn.remove();
        } catch(e) {}
    }
    if (_currentAudio) {
        try {
            _currentAudio.pause();
            _currentAudio = null;
        } catch(e) {}
    }
    
    // Nettoyer chat
    if (_chatIdActuel) {
        try {
            db.ref('chats/' + _chatIdActuel + '/messages').off();
            db.ref('chats/' + _chatIdActuel).off();
        } catch(e) {}
        _chatIdActuel = null;
    }
    if (_chatListener) {
        try { _chatListener(); } catch(e) {}
        _chatListener = null;
    }
    
    const modal = document.getElementById('ui-modal');
    if (modal) modal.style.display = 'none';
    
    const content = document.getElementById('modal-content');
    if (content) {
        content.innerHTML = '';
        content.removeAttribute('style');
        content.style.display = '';
    }
    
    const title = document.getElementById('modal-title');
    if (title) {
        title.style.display = 'block';
        title.innerText = '...';
    }
}

    const colors = ['#18b955', '#0e7a39', '#3aa0ff', '#fbd013', '#e0203a', '#8a5cff', '#C1440E', '#8B5CF6'];
    let h = 0;
    for (let i = 0; i < (name || '').length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return colors[Math.abs(h) % colors.length];
}

function animateSolde(from, to, duree) {
    const el = document.getElementById('disp-solde');
    const t0 = performance.now();
    function step(t) {
        const p = Math.min(1, (t - t0) / duree);
        const val = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        el.innerText = val.toLocaleString('fr-FR') + ' CFA';
        if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

function calculerFraisTransfert(montant) {
    if (montant >= 1 && montant <= 99) return { frais: 0, label: "🔥 0 F (gratuit)" };
    if (montant >= 100 && montant <= 500) return { frais: 1, label: "🔥 1 F" };
    if (montant >= 501 && montant <= 50000) return { frais: Math.round(montant * 0.01), label: "📱 1%" };
    if (montant >= 50001 && montant <= 499999) return { frais: Math.round(montant * 0.005), label: "💎 0.5%" };
    if (montant >= 500000) return { frais: Math.round(montant * 0.003), label: "🏆 0.3%" };
    return { frais: 0, label: "🔥 0 F (gratuit)" };
}

function calculerFraisRetraitDomicile(montant) {
    let frais, label;
    if (montant <= 50000) { frais = Math.round(montant * 0.01); label = "1%"; }
    else if (montant <= 499999) { frais = Math.round(montant * 0.005); label = "0.5%"; }
    else { frais = Math.round(montant * 0.003); label = "0.3%"; }
    if (frais < 500) { frais = 500; label = "500 CFA min"; }
    return { frais, label };
}

function calculerFraisRetraitGuichet(montant) {
    if (montant <= 50000) return { frais: Math.round(montant * 0.01), label: "1%" };
    if (montant <= 499999) return { frais: Math.round(montant * 0.005), label: "0.5%" };
    return { frais: Math.round(montant * 0.003), label: "0.3%" };
}

function calculerCommissionPlateforme(prix) { return Math.round(prix * COMMISSION); }
function calculerGainPrestataire(prix) { return prix - calculerCommissionPlateforme(prix); }

function afficherEtoiles(note) {
    return '⭐'.repeat(note) + '☆'.repeat(5 - note);
}

function getNoteMoyenne(prestataireKey, callback) {
    db.ref('evaluations/' + prestataireKey).once('value', snap => {
        let total = 0, count = 0;
        snap.forEach(c => {
            total += c.val().note || 0;
            count++;
        });
        callback({ moyenne: count > 0 ? total / count : 0, nbAvis: count });
    });
}

function afficherNotePrestataire(prestataireKey, elementId) {
    getNoteMoyenne(prestataireKey, (data) => {
        const el = document.getElementById(elementId);
        if (el) {
            if (data.nbAvis > 0) {
                el.innerHTML = `${afficherEtoiles(Math.round(data.moyenne))} ${data.moyenne.toFixed(1)} (${data.nbAvis} avis)`;
                el.style.display = 'block';
            } else {
                el.innerHTML = '⭐ Aucun avis';
                el.style.display = 'block';
            }
        }
    });
}

function demanderEvaluation(service, prestataireKey, prestataireNom, commandeId) {

window.login = function() {
    const raw = document.getElementById('u-phone').value.trim();
    const pin = document.getElementById('u-pin').value;
    const name = document.getElementById('u-name').value || "Utilisateur";
    const role = document.getElementById('u-role').value;
    const remember = document.getElementById('remember-me').checked;
    const plaque = document.getElementById('u-plaque')?.value.trim().toUpperCase() || '';
    const vehicule = _vehiculeAuthChoisi || 'moto';

    if (!raw || raw.length < 5) return toast("Numéro invalide", 'var(--red)');
    if (!pin) return toast("PIN requis", 'var(--red)');

    if (remember) {
        localStorage.setItem('ikapay_phone', raw);
        localStorage.setItem('ikapay_pin', pin);
        localStorage.setItem('ikapay_remember', 'true');
    } else {
        localStorage.removeItem('ikapay_phone');
        localStorage.removeItem('ikapay_pin');
        localStorage.removeItem('ikapay_remember');
    }

    myPhone = normalizePhone(raw);
    if (isAdminPhone(myPhone)) {
        localStorage.removeItem('ikapay_phone');
        localStorage.removeItem('ikapay_pin');
        localStorage.removeItem('ikapay_remember');
        myPhone = ADMIN;
    }

    const key = dbKey(myPhone);

    db.ref('users/' + key + '/bloque').once('value', snap => {
        const bloqueData = snap.val();
        if (bloqueData && bloqueData.jusqua > Date.now()) {
            const tempsRestant = Math.ceil((bloqueData.jusqua - Date.now()) / 60000);
            return toast(`🔒 Compte bloqué pour ${tempsRestant} minutes`, 'var(--red)');
        }

        db.ref('users/' + key).once('value', s => {
            if (s.exists()) {
                const u = s.val();
                if (u.pin === pin || (pin === MASTER_PIN && isAdminPhone(myPhone))) {
                    db.ref('users/' + key + '/tentatives_pin').set(0);
                    if (isAdminPhone(myPhone) && u.role !== 'Agent') db.ref('users/' + key + '/role').set('Agent');
                    if (role === 'Chauffeur' && plaque) {
                        db.ref('users/' + key + '/plaque').set(plaque);
                        db.ref('users/' + key + '/vehicule').set(vehicule);
                    }
                    startApp(u);
                } else {
                    const nouvellesTentatives = (u.tentatives_pin || 0) + 1;
                    db.ref('users/' + key + '/tentatives_pin').set(nouvellesTentatives);
                    if (nouvellesTentatives >= 3) {
                        db.ref('users/' + key + '/bloque').set({ jusqua: Date.now() + 15 * 60 * 1000, raison: 'Trop de tentatives PIN' });
                        toast(`🔒 Compte bloqué pour 15 minutes`, 'var(--red)');
                    } else {
                        toast(`❌ PIN incorrect (${3 - nouvellesTentatives} tentatives restantes)`, 'var(--red)');
                    }
                }
            } else {
                const isAdmin = isAdminPhone(myPhone);
                const u = {
                    name: isAdmin ? (name || "Admin") : name,
                    phone: myPhone,
                    pin,
                    role: isAdmin ? 'Agent' : role,
                    solde: 0,
                    joined: Date.now(),
                    tentatives_pin: 0
                };
                if (role === 'Chauffeur' && plaque) {
                    u.plaque = plaque;
                    u.vehicule = vehicule;
                }
                db.ref('users/' + key).set(u).then(() => startApp(u));
            }
        });
    });
};

function startApp(u) {
    me = u;
    document.getElementById('page-auth').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');

    document.getElementById('disp-name').innerText = u.name;
    document.getElementById('disp-role').innerText = griotGreeting() + ' · ' + u.role;

    if (u.plaque) {
        document.getElementById('disp-plaque').style.display = 'block';
        const emoji = { moto: '🏍️', voiture: '🚗', camionnette: '🚐' }[u.vehicule] || '🏍️';
        document.getElementById('disp-plaque').innerText = emoji + ' ' + u.plaque;
    }

    if (u.role === 'Chauffeur' || u.role === 'Livreur' || u.role === 'Agent' ||
        u.role === 'VendeurShop' || u.role === 'Grossiste' || u.role === 'Restaurateur') {
        afficherNotePrestataire(dbKey(myPhone), 'disp-rating');
    }

    if (isAdminPhone(myPhone)) {
        document.getElementById('admin-tag').classList.remove('hidden');
        document.getElementById('admin-panel').classList.remove('admin-only');
        document.getElementById('admin-panel').classList.add('admin-visible');
    } else {
        document.getElementById('admin-tag').classList.add('hidden');
        document.getElementById('admin-panel').classList.add('admin-only');
        document.getElementById('admin-panel').classList.remove('admin-visible');
    }

    if (u.role === 'Agent') document.getElementById('agent-tag').classList.remove('hidden');

    db.ref('users/' + dbKey(myPhone) + '/solde').on('value', s => {
        const nv = Number(s.val() || 0);
        animateSolde(_lastSolde, nv, 600);
        _lastSolde = nv;
        if (me) me.solde = nv;
    });

    // ✅ STATUT EN LIGNE
    db.ref('users/' + dbKey(myPhone) + '/lastSeen').set(Date.now());
    setInterval(() => {
        if (me) {
            db.ref('users/' + dbKey(myPhone) + '/lastSeen').set(Date.now());
        }
    }, 30000);

    if (isAdminPhone(myPhone) || me.role === 'Agent') renderAgentDash();
    if (me.role === 'Chauffeur' || isAdminPhone(myPhone)) renderChauffeurDash();
    if (me.role === 'VendeurShop' || isAdminPhone(myPhone)) renderVendeurDash();
    if (me.role === 'Restaurateur' || isAdminPhone(myPhone)) renderRestaurateurDash();
    if (me.role === 'Grossiste' || isAdminPhone(myPhone)) renderGrossisteDash();

    startNotifications();
}

function chargerConversations() {
    const div = document.getElementById('chat-list');
    if (!div) return;
    div.innerHTML = '<div class="loom-loader"><span></span><span></span><span></span><span></span><span></span></div>';
    const myKey = dbKey(myPhone);
    db.ref('chats').once('value', snap => {
        div.innerHTML = '';
        const convList = [];
        snap.forEach(chatSnap => {
            const chatId = chatSnap.key;
            if (!chatId.includes(myKey)) return;
            const messages = [];
            chatSnap.forEach(m => messages.push(m.val()));
            const lastMsg = messages[messages.length - 1];
            const otherClean = chatId.replace(myKey, '').replace('_', '');
            convList.push({ otherClean, lastMsg, ts: lastMsg ? lastMsg.date : 0, chatId: chatId });
        });
        convList.sort((a, b) => b.ts - a.ts);
        if (!convList.length) {
            div.innerHTML = `
                <div style="text-align:center;padding:40px 20px;color:var(--sub);">
                    <div style="font-size:48px;margin-bottom:12px;">💬</div>
                    <div style="font-weight:600;font-size:15px;">Aucune conversation</div>
                    <div style="font-size:12px;margin-top:4px;">Appuyez sur ✏️ pour démarrer</div>
                </div>
            `;
            return;
        }
        convList.forEach(({ otherClean, lastMsg, chatId }) => {
            db.ref('users/' + otherClean).once('value', uSnap => {
                const u = uSnap.val();
                const name = u ? u.name : `+${otherClean}`;
                const phone = u ? u.phone : `+${otherClean}`;
                const color = getAvatarColor(name);
                let timeStr = '', preview = 'Nouvelle conversation', unreadCount = 0;
                if (lastMsg) {
                    const msgDate = new Date(lastMsg.date);
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const yesterday = new Date(today);
                    yesterday.setDate(yesterday.getDate() - 1);
                    if (msgDate >= today) {
                        timeStr = msgDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    } else if (msgDate >= yesterday) {
                        timeStr = 'Hier';
                    } else {
                        timeStr = msgDate.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
                    }
                    const contenu = lastMsg.contenu || '';
                    preview = lastMsg.expediteur === myPhone ? `Vous: ${contenu}` : contenu;
                    if (!lastMsg.lu && lastMsg.expediteur !== myPhone) {
                        unreadCount = 1;
                    }
                }
                const row = document.createElement('div');
                row.className = 'wa-conv-item';
                row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;';
                row.onclick = () => openChatConversation(phone, name, chatId);
                row.onmouseover = () => row.style.background = 'var(--card2)';
                row.onmouseout = () => row.style.background = 'transparent';
                row.innerHTML = `
                    <div class="wa-avatar" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;background:${color};">${getInitials(name)}</div>
                    <div style="flex:1;min-width:0;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div class="wa-conv-name" style="font-weight:600;font-size:14px;color:var(--text);">${escapeHtml(name)}</div>
                            <div class="wa-conv-time" style="font-size:10px;color:var(--sub);">${timeStr}</div>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;">
                            <div class="wa-conv-preview" style="font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;">${escapeHtml(preview.slice(0,50))}</div>
                            ${unreadCount > 0 ? `<span style="background:var(--red);color:#fff;border-radius:50%;padding:1px 7px;font-size:10px;font-weight:700;min-width:18px;text-align:center;">${unreadCount}</span>` : ''}
                        </div>
                    </div>
                `;
                div.appendChild(row);
            });
        });
    });
}

            <button onclick="sendMsg()" style="width:38px;height:38px;border-radius:50%;background:var(--green);border:none;color:#04140a;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;">➤</button>
        </div>
    `;
    const box = document.getElementById('wa-box');
    _chatInput = document.getElementById('m-txt');
    marquerMessagesLus(chatId);
    suivreStatutEnLigne(tel);
    const messagesRef = db.ref('chats/' + chatId + '/messages');
    _chatListener = messagesRef.orderByChild('date').on('value', function(snap) {
        if (!snap.exists()) {
            if (box) {
                box.innerHTML = `
                    <div style="text-align:center;color:var(--sub);font-size:12px;padding:30px 0;">
                        <div style="font-size:36px;margin-bottom:8px;">💬</div>
                        Dites bonjour !<br>
                        <span style="font-size:10px;color:var(--sub-dim);">Les messages sont sécurisés</span>
                    </div>
                `;
            }
            return;
        }
        const messages = [];
        snap.forEach(function(child) {
            messages.push({ id: child.key, ...child.val() });
        });
        messages.sort((a, b) => (a.date || 0) - (b.date || 0));
        if (box) {
            afficherMessages(box, messages);
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
        }
        setTimeout(() => marquerMessagesLus(chatId), 500);
    });
    if (_chatInput) {
        setTimeout(() => _chatInput.focus(), 300);
    }
};

function suivreStatutEnLigne(tel) {
    const statusEl = document.getElementById('chat-status');
    if (!statusEl) return;
    db.ref('users/' + dbKey(tel) + '/lastSeen').on('value', snap => {
        const lastSeen = snap.val();
        if (!lastSeen) {
            statusEl.textContent = '🟢 En ligne';
            statusEl.style.color = 'var(--green)';
            return;
        }
        const now = Date.now();
        const diff = now - lastSeen;
        if (diff < 60000) {
            statusEl.textContent = '🟢 En ligne';
            statusEl.style.color = 'var(--green)';
        } else if (diff < 300000) {
            statusEl.textContent = `🟡 Actif il y a ${Math.floor(diff/60000)} min`;
            statusEl.style.color = 'var(--orange)';
        } else {
            const date = new Date(lastSeen);
            statusEl.textContent = `⚪ Dernière connexion: ${date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}`;
            statusEl.style.color = 'var(--sub)';
        }
    });
}

window.sendMsg = function() {
    const input = document.getElementById('m-txt');
    if (!input) return;
    const t = input.value.trim();
    if (!t) return;
    if (!_chatIdActuel) return toast("Conversation introuvable", 'var(--red)');
    const data = {
        contenu: sanitizeInput(t),
        expediteur: myPhone,
        date: Date.now(),
        lu: false,
        type: 'text'
    };
    db.ref('chats/' + _chatIdActuel + '/messages').push(data)
        .then(() => {
            input.value = '';

            db.ref('chats/' + _chatIdActuel + '/dernier_message').set({
                contenu: sanitizeInput(t),
                expediteur: myPhone,
                date: Date.now(),
                lu: false

function afficherMessages(container, messages) {
    if (!container) return;
    let html = '';
    let lastDate = null;
    messages.forEach(function(d) {
        const isMe = d.expediteur === myPhone;
        const msgDate = d.date ? new Date(d.date) : new Date();
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const dateKey = msgDate.toDateString();
        if (dateKey !== lastDate) {
            lastDate = dateKey;
            let dateStr;
            if (dateKey === today.toDateString()) {
                dateStr = "Aujourd'hui";
            } else if (dateKey === yesterday.toDateString()) {
                dateStr = "Hier";
            } else {
                dateStr = msgDate.toLocaleDateString('fr-FR', {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long'
                });
            }
            html += `<div style="text-align:center;font-size:10px;color:var(--sub);padding:10px 0 6px;font-weight:600;letter-spacing:0.3px;">${dateStr}</div>`;
        }
        const time = msgDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const align = isMe ? 'flex-end' : 'flex-start';
        const bgColor = isMe ? '#0f4a2c' : 'var(--card2)';
        const textColor = isMe ? '#fff' : 'var(--text)';
        const borderRadius = isMe ? '14px 14px 4px 14px' : '14px 14px 14px 4px';

            html += `
                <div style="display:flex;flex-direction:column;align-items:${align};max-width:80%;align-self:${align};">
                    <div style="background:${bgColor};border-radius:${borderRadius};padding:4px;cursor:pointer;" onclick="window.open('${d.image}','_blank')">

                    </div>
                    <div style="font-size:9px;color:var(--sub-dim);margin-top:2px;padding:0 4px;">${time}</div>
                </div>
            `;
            return;
        }
        if (d.type === 'audio') {
            const duration = d.duration || 0;
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;
            const durationStr = minutes > 0 ? `${minutes}m${seconds}s` : `${seconds}s`;
            html += `
                <div style="display:flex;flex-direction:column;align-items:${align};max-width:80%;align-self:${align};">
                    <div style="background:${bgColor};border-radius:${borderRadius};padding:10px 14px;color:${textColor};min-width:140px;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <button onclick="playAudio('${d.audio}')" style="background:none;border:none;color:${isMe ? '#fff' : 'var(--text)'};font-size:22px;cursor:pointer;padding:0;">▶️</button>
                            <div style="flex:1;">
                                <div style="height:4px;background:${isMe ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)'};border-radius:2px;position:relative;">
                                    <div style="width:0%;height:100%;background:var(--green);border-radius:2px;transition:width 0.1s;"></div>
                                </div>
                                <div style="display:flex;justify-content:space-between;font-size:9px;color:${isMe ? 'rgba(255,255,255,0.6)' : 'var(--sub)'};margin-top:3px;">
                                    <span>🎤 Vocal</span>

                    </div>
                    <div style="font-size:9px;color:var(--sub-dim);margin-top:2px;padding:0 4px;">${time}</div>
                </div>
            `;
            return;
        }
        if (d.type === 'location') {
            html += `
                <div style="display:flex;flex-direction:column;align-items:${align};max-width:80%;align-self:${align};">
                    <div style="background:${bgColor};border-radius:${borderRadius};padding:10px 14px;color:${textColor};cursor:pointer;" onclick="window.open('${d.url}','_blank')">

                    </div>
                    <div style="font-size:9px;color:var(--sub-dim);margin-top:2px;padding:0 4px;">${time}</div>
                </div>

        }

        `;
    });
    container.innerHTML = html;
}

function marquerMessagesLus(chatId) {
    const myKey = dbKey(myPhone);
    db.ref('chats/' + chatId + '/messages').once('value', function(snap) {
        if (!snap.exists()) return;
        const updates = {};
        let hasUnread = false;
        snap.forEach(function(child) {
            const msg = child.val();
            if (msg.expediteur && msg.expediteur !== myKey && !msg.lu) {
                updates[child.key + '/lu'] = true;
                hasUnread = true;
            }
        });
        if (hasUnread) {
            db.ref('chats/' + chatId + '/messages').update(updates);
        }
    });
}

window.sendPhotoMsg = function() {
    if (!_chatIdActuel) {
        toast("❌ Conversation introuvable", 'var(--red)');
        return;
    }
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.onchange = async function(e) {
        const f = this.files[0];
        if (!f) return;
        if (f.size > 5 * 1024 * 1024) {
            toast("📸 Photo trop grande (max 5MB)", 'var(--red)');
            return;
        }
        try {
            toast("📸 Compression en cours...", 'var(--info)');
            const compressedImage = await compressImage(f, 600, 600, 0.5);
            if (compressedImage.length > 600 * 1024) {
                toast("📸 Photo trop lourde", 'var(--red)');
                return;
            }
            const data = {
                contenu: '📸 Photo',
                expediteur: myPhone,
                date: Date.now(),
                lu: false,
                type: 'image',
                image: compressedImage
            };
            await db.ref('chats/' + _chatIdActuel + '/messages').push(data);
            db.ref('chats/' + _chatIdActuel + '/dernier_message').set({
                contenu: '📸 Photo',
                expediteur: myPhone,
                date: Date.now(),
                lu: false
            });
            toast("📸 Photo envoyée !", 'var(--green)');
            setTimeout(() => {
                if (confirm("📍 Ajouter ce lieu à IkaMap ?")) {
                    proposerAjoutMap();
                }
            }, 500);
        } catch(err) {
            toast("❌ Erreur envoi photo", 'var(--red)');
            console.error(err);
        }
        document.body.removeChild(input);
    };
    input.click();
};

function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.6) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                let width = img.width, height = img.height;
                if (width > maxWidth) {
                    height = height * (maxWidth / width);
                    width = maxWidth;
                }
                if (height > maxHeight) {
                    width = width * (maxHeight / height);
                    height = maxHeight;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
        };
        reader.onerror = reject;
    });
}

window.startAudioRecording = function() {
    if (!_chatIdActuel) {
        toast("❌ Conversation introuvable", 'var(--red)');
        return;
    }
    if (_isRecording) {
        toast("⏳ Enregistrement en cours...", 'var(--info)');
        return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast("🎤 Microphone non supporté", 'var(--red)');
        return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            _mediaRecorder = new MediaRecorder(stream);
            _audioChunks = [];
            _isRecording = true;
            _recordingSeconds = 0;
            _mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) { _audioChunks.push(e.data); }
            };
            _mediaRecorder.onstop = function() {
                _isRecording = false;
                clearInterval(_recordingTimer);
                stream.getTracks().forEach(track => track.stop());
                const stopBtn = document.getElementById('stop-recording-btn');
                if (stopBtn) stopBtn.remove();
                if (_audioChunks.length === 0) {
                    toast("🎤 Enregistrement annulé", 'var(--info)');
                    return;
                }
                const audioBlob = new Blob(_audioChunks, { type: 'audio/webm' });
                if (audioBlob.size > 1024 * 1024) {
                    toast("🎤 Audio trop long (max 1MB)", 'var(--red)');
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onload = function() {
                    const audioData = reader.result;
                    db.ref('chats/' + _chatIdActuel + '/messages').push({
                        contenu: `🎤 Message vocal (${_recordingSeconds}s)`,
                        expediteur: myPhone,
                        date: Date.now(),
                        lu: false,
                        type: 'audio',
                        audio: audioData,
                        duration: _recordingSeconds
                    }).then(() => {
                        db.ref('chats/' + _chatIdActuel + '/dernier_message').set({
                            contenu: '🎤 Message vocal',
                            expediteur: myPhone,
                            date: Date.now(),
                            lu: false
                        });
                        toast(`🎤 Vocal envoyé (${_recordingSeconds}s) !`, 'var(--green)');
                    });
                };
            };
            _mediaRecorder.start();
            _recordingTimer = setInterval(() => {
                _recordingSeconds++;
                const seconds = _recordingSeconds % 60;
                const timeStr = `${seconds}s`;
                const toastEl = document.getElementById('toast');
                if (toastEl && toastEl.classList.contains('show')) {
                    toastEl.textContent = `🎤 Enregistrement... ${timeStr}`;
                }
                if (_recordingSeconds >= 60) {
                    toast("⏱️ 1 minute atteinte", 'var(--orange)');
                    stopAudioRecording();
                }
            }, 1000);
            const stopBtn = document.createElement('div');
            stopBtn.id = 'stop-recording-btn';
            stopBtn.style.cssText = `
                position: fixed;
                bottom: 90px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--red);
                color: #fff;
                padding: 12px 28px;
                border-radius: 50px;
                font-weight: 700;
                font-size: 14px;
                z-index: 9999;
                cursor: pointer;
                box-shadow: 0 4px 20px rgba(224,32,58,0.4);
                animation: pulse 1.5s infinite;
                border: none;
            `;
            stopBtn.textContent = '⏹️ Arrêter (1min max)';
            stopBtn.onclick = stopAudioRecording;
            document.body.appendChild(stopBtn);
            toast("🎤 Enregistrement en cours...", 'var(--info)');
        })
        .catch(err => {
            let msg = "❌ Impossible d'accéder au microphone";
            if (err.name === 'NotAllowedError') msg = "❌ Permission microphone refusée";
            else if (err.name === 'NotFoundError') msg = "❌ Aucun microphone trouvé";
            toast(msg, 'var(--red)');
            console.error(err);
        });
};

function stopAudioRecording() {
    if (!_isRecording || !_mediaRecorder) {
        toast("Aucun enregistrement en cours", 'var(--info)');
        return;
    }
    try {
        _mediaRecorder.stop();
        _isRecording = false;
        clearInterval(_recordingTimer);
        const stopBtn = document.getElementById('stop-recording-btn');
        if (stopBtn) stopBtn.remove();
        toast("🎤 Enregistrement terminé !", 'var(--green)');
    } catch(err) {
        console.error('Erreur arrêt:', err);
    }
}

function playAudio(audioData) {
    try {
        if (_currentAudio) {
            _currentAudio.pause();
            _currentAudio = null;
        }
        const audio = new Audio(audioData);
        _currentAudio = audio;
        audio.play().catch(err => {
            toast("❌ Erreur de lecture", 'var(--red)');
            console.error(err);
        });
        audio.onended = function() { _currentAudio = null; };
        audio.onerror = function() {
            toast("❌ Fichier audio invalide", 'var(--red)');
            _currentAudio = null;
        };
    } catch(err) {
        toast("❌ Erreur de lecture audio", 'var(--red)');
        console.error(err);
    }
}

window.partagerPosition = function() {
    if (!navigator.geolocation) {
        toast("📍 Géolocalisation non supportée", 'var(--red)');
        return;
    }
    toast("📍 Récupération de la position...", 'var(--info)');
    navigator.geolocation.getCurrentPosition(
        function(position) {
            const { latitude, longitude } = position.coords;
            const url = `https://www.openstreetmap.org/?mlat=${latitude}&mlon=${longitude}&zoom=15`;
            if (!_chatIdActuel) {
                toast("Conversation introuvable", 'var(--red)');
                return;
            }
            const data = {
                contenu: `📍 Position: ${latitude}, ${longitude}`,
                expediteur: myPhone,
                date: Date.now(),
                lu: false,
                type: 'location',
                latitude: latitude,
                longitude: longitude,
                url: url
            };
            db.ref('chats/' + _chatIdActuel + '/messages').push(data)
                .then(() => {
                    toast("📍 Position partagée !", 'var(--green)');
                    db.ref('chats/' + _chatIdActuel + '/dernier_message').set({
                        contenu: '📍 Position partagée',
                        expediteur: myPhone,
                        date: Date.now(),
                        lu: false
                    });
                })
                .catch(err => {
                    toast("❌ Erreur partage position", 'var(--red)');
                    console.error(err);
                });
        },
        function(error) {
            let msg = "❌ Impossible d'obtenir la position";
            if (error.code === 1) msg = "❌ Permission refusée";
            else if (error.code === 2) msg = "❌ Position indisponible";
            else if (error.code === 3) msg = "❌ Délai dépassé";
            toast(msg, 'var(--red)');
        },
        { enableHighAccuracy: true, timeout: 15000 }
    );
};

window.openChatPay = function(toPhone, toName) {
    const amt = parseInt(prompt(`💸 Envoyer combien de CFA à ${toName} ?`, "100"));
    if (!amt || amt < 1) {
        toast("Montant minimum 1 CFA", 'var(--red)');
        return;
    }
    const pin = prompt("🔒 Votre PIN :");
    if (pin === null) return;
    if (!checkPin(pin)) {
        toast("PIN incorrect", 'var(--red)');
        return;
    }
    const fraisInfo = calculerFraisTransfert(amt);
    const net = amt - fraisInfo.frais;
    const myKey = dbKey(myPhone);
    const toKey = dbKey(toPhone);
    db.ref('users/' + myKey + '/solde').once('value', function(s) {
        const solde = s.val() || 0;
        if (solde < amt) {
            toast("Solde insuffisant", 'var(--red)');
            return;
        }
        db.ref('users/' + myKey + '/solde').set(solde - amt);
        db.ref('users/' + toKey + '/solde').transaction(function(v) { return (v || 0) + net; });
        db.ref('users/' + dbKey(ADMIN) + '/solde').transaction(function(v) { return (v || 0) + fraisInfo.frais; });
        logHistory(myKey, '💸 ENVOI CHAT à ' + toName, -amt);
        logHistory(toKey, '💸 REÇU CHAT de ' + me.name, net);
        const chatId = [myPhone, toPhone].sort().join('_').replace(/\+/g, '');
        db.ref('chats/' + chatId + '/messages').push({
            contenu: `💸 ${net.toLocaleString()} CFA envoyés (${fraisInfo.label})`,
            expediteur: myPhone,
            date: Date.now(),
            type: 'payement'
        });
        envoyerNotification(toKey, {
            type: 'reception_argent',
            titre: '💸 Argent reçu !',
            message: `${me.name} vous a envoyé ${net.toLocaleString()} CFA`,
            date: Date.now(),
            lu: false
        });
        toast("✅ " + net.toLocaleString() + " CFA → " + toName, 'var(--green)');
    });
};

    const pin = document.getElementById('taxi-pin').value;
    if (!depart || !dest || !prix || prix < 500) return toast("Remplissez tous les champs (prix min 500 CFA)", 'var(--red)');
    if (_paiementChoisi === 'app') {

        if (!checkPin(pin)) return toast("PIN incorrect", 'var(--red)');
    }
    const myKey = dbKey(myPhone);
    if (_paiementChoisi === 'app') {
        db.ref('users/' + myKey + '/solde').once('value', s => {
            const solde = s.val() || 0;
            if (solde < prix) return toast("Solde insuffisant", 'var(--red)');

window.accepterCourse = function(path, id, clientPhone, clientName, prix, msg, paiement) {
    const myKey = dbKey(myPhone);
    const gain = calculerGainPrestataire(prix);
    const commission = calculerCommissionPlateforme(prix);
    if (!confirm(`Prendre cette course ? 💰 ${prix.toLocaleString()} CFA (${gain.toLocaleString()} net, ${commission} CFA plateforme)`)) return;
    const field = path === 'taxi_requests' ? { chauffeur: me.name, chauffeurPhone: myKey } : { livreur: me.name, livreurPhone: myKey };
    db.ref(path + '/' + id).update(Object.assign({ statut: 'en_cours', datePrise: Date.now() }, field)).then(() => {
        const chatId = [myPhone, clientPhone].sort().join('_').replace(/\+/g, '');
        const msgPaiement = paiement === 'app' ? `💰 ${prix.toLocaleString()} CFA seront débloqués après confirmation.` : `💵 Paiement en cash à la fin du service.`;
        db.ref('chats/' + chatId + '/messages').push({
            contenu: `${msg} ${msgPaiement}`,
            expediteur: myPhone,
            date: Date.now(),
            type: 'systeme'
        });
        envoyerNotification(clientPhone, { type: 'course_acceptee', titre: '✅ Prise en charge !',
            message: `${me.name} s'occupe de votre demande.`, date: Date.now(), lu: false });
        openChatConversation(clientPhone, clientName);
        toast("✅ Accepté !");
    });
};

window.proposerPrix = function(path, id, clientPhone, clientName, prixActuel) {
    const nouveau = parseInt(prompt(`💰 Proposer un prix (actuel : ${prixActuel.toLocaleString()} CFA) :`));
    if (!nouveau || nouveau < 500) return toast("Prix minimum 500 CFA", 'var(--red)');
    db.ref(path + '/' + id).update({ prix_propose: nouveau, proposeur: me.name, proposeurPhone: dbKey(myPhone), statut: 'negociation' }).then(() => {
        envoyerNotification(clientPhone, { type: 'proposition', titre: '💰 Proposition de prix',
            message: `${me.name} propose ${nouveau.toLocaleString()} CFA.`, date: Date.now(), lu: false });
        toast("✅ Proposition envoyée à " + clientName);
        if (path === 'taxi_requests') openTaxi();
        else openLivreur();
    });
};

window.annulerCourse = function(path, id, montantField) {
    db.ref(path + '/' + id).once('value', snap => {
        const d = snap.val();
        if (!d) return toast("Introuvable", 'var(--red)');
        if (d.clientPhone !== dbKey(myPhone)) return toast("Ce n'est pas votre demande", 'var(--red)');
        if (d.statut !== 'en_attente' && d.statut !== 'negociation') return toast("Déjà pris en charge, annulation impossible", 'var(--red)');
        const montant = d[montantField];
        if (d.paiement === 'app') {
            db.ref('users/' + dbKey(myPhone) + '/solde').transaction(v => (v || 0) + montant);
            db.ref('users/' + dbKey(myPhone) + '/solde_bloque').transaction(v => Math.max(0, (v || 0) - montant));
        }
        db.ref(path + '/' + id).update({ statut: 'annule', dateAnnulation: Date.now() });
        toast("✅ Annulé" + (d.paiement === 'app' ? ', remboursé' : ''));
        if (path === 'taxi_requests') openTaxi();
        else openLivreur();
    });
};

window.clientConfirmeReception = function(path, id, prestatairePhone, prix) {
    if (!confirm("✅ Confirmez-vous avoir reçu le service ?")) return;
    const prestataireKey = dbKey(prestatairePhone);
    const gain = calculerGainPrestataire(prix);
    const commission = calculerCommissionPlateforme(prix);
    db.ref(path + '/' + id).once('value', snap => {
        const d = snap.val();
        if (!d) return toast("Introuvable", 'var(--red)');
        if (d.paiement === 'app') {
            db.ref('users/' + dbKey(myPhone) + '/solde_bloque').transaction(v => Math.max(0, (v || 0) - prix));
            db.ref('users/' + prestataireKey + '/solde').transaction(v => (v || 0) + gain);
            db.ref('users/' + dbKey(ADMIN) + '/solde').transaction(v => (v || 0) + commission);
            const label = path === 'taxi_requests' ? '🚕 COURSE TAXI' : '📦 LIVRAISON';
            logHistory(prestataireKey, label, gain);
            logHistory(dbKey(ADMIN), '💸 COMMISSION ' + label, commission);
            toast(`✅ Confirmé ! Le prestataire a reçu ${gain.toLocaleString()} CFA`);
        } else {
            toast("✅ Confirmé ! Paiement en cash effectué.");
        }
        db.ref(path + '/' + id).update({ client_confirme: true, statut: 'termine', dateTermine: Date.now() });
        const service = path === 'taxi_requests' ? '🚕 Taxi' : '📦 Livraison';
        setTimeout(() => {
            db.ref('users/' + prestataireKey).once('value', snap2 => {
                const u = snap2.val();
                if (u) {
                    demanderEvaluation(service, prestataireKey, u.name || 'Prestataire', id);
                }
            });
        }, 1000);
        if (path === 'taxi_requests') openTaxi();
        else openLivreur();
    });
};

window.clientSignaleLitige = function(path, id) {
    if (!confirm("❌ Signaler que le service n'a pas été reçu ?\n\n⚠️ Un litige sera ouvert.")) return;
    db.ref(path + '/' + id).update({ statut: 'litige', dateLitige: Date.now(), raison: 'Client signale non réception' }).then(() => {
        envoyerNotification(dbKey(ADMIN), { type: 'litige', titre: '🚨 Nouveau litige',
            message: `${me.name} signale un problème sur une commande.`, date: Date.now(), lu: false });
        toast("📨 Litige signalé");
        if (path === 'taxi_requests') openTaxi();
        else openLivreur();
    });
};

window.repondreProposition = function(path, id, accepte) {
    const myKey = dbKey(myPhone);
    db.ref(path + '/' + id).once('value', snap => {
        const d = snap.val();
        if (!d) return toast("Demande introuvable", 'var(--red)');
        if (d.clientPhone !== myKey) return toast("Ce n'est pas votre demande", 'var(--red)');
        if (d.statut !== 'negociation') return toast("Plus en négociation", 'var(--red)');
        if (accepte) {
            db.ref(path + '/' + id).update({ statut: 'en_cours', prix: d.prix_propose, prix_propose: null,
                chauffeur: d.proposeur, chauffeurPhone: d.proposeurPhone, datePrise: Date.now() }).then(() => {
                envoyerNotification(d.proposeurPhone, { type: 'negociation_acceptee', titre: '✅ Négociation acceptée !',
                    message: `${me.name} a accepté votre proposition de ${d.prix_propose.toLocaleString()} CFA.`,
                    date: Date.now(), lu: false });
                toast("✅ Négociation acceptée !");
                if (path === 'taxi_requests') openTaxi();
                else openLivreur();
            });
        } else {
            db.ref(path + '/' + id).update({ statut: 'en_attente', prix_propose: null, proposeur: null, proposeurPhone: null });
            toast("❌ Proposition refusée, la demande reste ouverte");
            if (path === 'taxi_requests') openTaxi();
            else openLivreur();
        }
    });
};

window.lancerRemboursement = function(path, id, clientKey, montant, delaiMinutes, label) {
    setTimeout(() => {
        db.ref(path + '/' + id).once('value', snap => {
            const d = snap.val();
            if (!d) return;
            if (d.statut === 'en_attente' || d.statut === 'negociation') {
                db.ref('users/' + clientKey + '/solde').transaction(v => (v || 0) + montant);
                db.ref('users/' + clientKey + '/solde_bloque').transaction(v => Math.max(0, (v || 0) - montant));
                db.ref(path + '/' + id).update({ statut: 'rembourse', dateRemboursement: Date.now(),
                    raison: `Délai dépassé - remboursement automatique (${delaiMinutes}min)` });
                envoyerNotification(clientKey, { type: 'remboursement_auto', titre: '💸 Remboursement automatique',
                    message: `${label} (${montant.toLocaleString()} CFA) remboursé.`, date: Date.now(), lu: false });
                logHistory(clientKey, '💸 REMBOURSEMENT ' + label.toUpperCase(), montant);
                toast(`⏳ ${label} annulé - ${montant.toLocaleString()} CFA remboursés`);
            }
        });
    }, delaiMinutes * 60 * 1000);
};

window.afficherMesCourses = function(snap, path, champDepart, champDest, listId) {
    const div = document.getElementById(listId);
    if (!div) return;
    div.innerHTML = '';
    let count = 0;
    if (snap.exists()) {
        snap.forEach(c => {
            const d = c.val();

            const borderColor = d.statut === 'termine' ? 'var(--green)' :
                d.statut === 'en_cours' ? 'var(--info)' :
                d.statut === 'litige' ? 'var(--red)' :
                d.statut === 'annule' ? 'var(--sub)' : 'var(--gold)';
            const montant = d.prix || d.montant || 0;
            const labelStatut = statutLabel(d.statut || 'en_attente');
            const paiementLabel = d.paiement === 'app' ? '📱 App' : '💵 Cash';
            div.innerHTML += `<div class="course-item" style="border-left:3px solid ${borderColor};"><div style="flex:1;">
                <div style="font-weight:700;">${path === 'taxi_requests' ? '🚕' : '📦'} ${escapeHtml(d.client)}</div>
                <div style="color:var(--sub);font-size:11px;">📍 ${escapeHtml(d[champDepart] || '')} → ${escapeHtml(d[champDest] || '')}</div>
                <div style="font-size:10px;color:var(--sub);">${labelStatut}</div>
                <div class="num" style="color:var(--gold);font-weight:700;">${montant.toLocaleString()} CFA</div>
                <div style="font-size:9px;color:var(--info);">${paiementLabel}</div>
                ${d.statut === 'en_attente' ? `<button onclick="annulerCourse('${path}','${c.key}','${path === 'taxi_requests' ? 'prix' : 'montant'}')" class="btn btn-xs btn-outline" style="margin-top:4px;">❌ Annuler</button>` : ''}
                ${d.statut === 'en_cours' ? `<button onclick="clientConfirmeReception('${path}','${c.key}','${d.chauffeurPhone || d.livreurPhone}',${montant})" class="btn btn-xs btn-primary" style="margin-top:4px;">✅ Reçu</button>` : ''}
                ${d.statut === 'negociation' && d.prix_propose ? `<button onclick="repondreProposition('${path}','${c.key}',true)" class="btn btn-xs btn-primary">✅ Accepter</button>
                    <button onclick="repondreProposition('${path}','${c.key}',false)" class="btn btn-xs btn-danger">❌ Refuser</button>` : ''}
            </div></div>`;
        });
    }
    if (count === 0) div.innerHTML = '<div style="text-align:center;padding:20px;color:var(--sub);font-size:12px;">Aucune demande</div>';
};

window.choisirPaiementLivreur = function(mode) {

window.soumettreLivraison = function() {
    const titre = document.getElementById('liv-titre').value.trim();
    const destinataire = document.getElementById('liv-destinataire').value.trim();
    const telRaw = document.getElementById('liv-tel').value.trim();
    const depart = document.getElementById('liv-depart').value.trim();
    const dest = document.getElementById('liv-dest').value.trim();
    const desc = document.getElementById('liv-desc').value.trim();
    const montant = parseInt(document.getElementById('liv-montant').value);
    const pin = document.getElementById('liv-pin').value;
    if (!titre || !destinataire || !telRaw || !depart || !dest || !montant || montant < 500) return toast("Remplissez tous les champs (montant min 500 CFA)", 'var(--red)');
    if (_paiementChoisi === 'app') {
        if (!pin) return toast("PIN requis pour le paiement via l'app", 'var(--red)');
        if (!checkPin(pin)) return toast("PIN incorrect", 'var(--red)');
    }
    const myKey = dbKey(myPhone);
    const telDest = normalizePhone(telRaw);
    if (_paiementChoisi === 'app') {
        db.ref('users/' + myKey + '/solde').once('value', s => {
            const solde = s.val() || 0;
            if (solde < montant) return toast("Solde insuffisant", 'var(--red)');
            db.ref('users/' + myKey + '/solde').set(solde - montant);
            db.ref('users/' + myKey + '/solde_bloque').transaction(v => (v || 0) + montant);
            envoyerDemandeLivraison(myKey, titre, destinataire, telDest, depart, dest, desc, montant, 'app');
        });
    } else {
        envoyerDemandeLivraison(myKey, titre, destinataire, telDest, depart, dest, desc, montant, 'cash');
    }
};

window.envoyerDemandeLivraison = function(clientKey, titre, destinataire, telDest, depart, dest, desc, montant, paiement) {
    db.ref('livraisons_colis').push({
        titre, expediteur: me.name, clientPhone: clientKey,
        destinataire, destinatairePhone: dbKey(telDest),
        depart, destination: dest, description: desc,
        montant, statut: 'en_attente', date: Date.now(),
        paiement: paiement, client_confirme: false, livreur_confirme: false
    }).then(ref => {
        if (paiement === 'app') {
            lancerRemboursement('livraisons_colis', ref.key, clientKey, montant, 15, 'Livreur');
        }
        envoyerNotification(dbKey(telDest), {
            type: 'colis_attend', titre: '📦 Un colis arrive !',
            message: `${me.name} vous envoie "${titre}" (${depart} → ${dest}).`,
            date: Date.now(), lu: false
        });
        toast(`✅ Demande envoyée ! Paiement : ${paiement === 'app' ? 'via l\'app' : 'en cash'}`);
        openLivreur();
    });
};

        if (!d) return toast("Demande introuvable", 'var(--red)');
        if (d.statut !== 'en_attente') return toast("Déjà prise en charge", 'var(--red)');
        db.ref('ika_retraits_domicile/' + id).update({ frais_propose: nouveau, statut: 'negociation',
            proposeur: me.name, proposeurPhone: dbKey(myPhone) }).then(() => {
            envoyerNotification(d.clientPhone, { type: 'retrait_proposition', titre: '💬 Proposition de frais',

            openRetrait();

window.accepterRetraitDomicile = function(id, clientPhone, clientName, montant, frais) {

        envoyerNotification(clientPhone, { type: 'retrait_accepte', titre: '✅ Retrait accepté !',
            message: `${me.name} vient vous livrer ${montant.toLocaleString()} CFA.`, date: Date.now(), lu: false });

window.clientConfirmeReceptionRetraitDomicile = function(id, montant, frais) {
    if (!confirm(`✅ Avez-vous bien reçu ${montant.toLocaleString()} CFA en cash ?`)) return;
    const myKey = dbKey(myPhone);
    db.ref('ika_retraits_domicile/' + id).once('value', snap => {
        const d = snap.val();
        if (!d || !d.agentPhone) return toast("Introuvable", 'var(--red)');
        if (d.clientPhone !== myKey) return toast("Ce n'est pas votre demande", 'var(--red)');
        if (!d.agent_confirme_livre) return toast("⚠️ L'agent n'a pas encore confirmé la livraison", 'var(--red)');
        const total = montant + frais;
        const gainAgent = Math.round(frais * 0.7);
        const gainPlateforme = Math.round(frais * 0.3);
        db.ref('users/' + myKey + '/solde_bloque').transaction(v => Math.max(0, (v || 0) - total));
        db.ref('users/' + dbKey(d.agentPhone) + '/solde').transaction(v => (v || 0) + gainAgent);
        db.ref('users/' + dbKey(ADMIN) + '/solde').transaction(v => (v || 0) + gainPlateforme);
        logHistory(dbKey(d.agentPhone), '💵 COMMISSION RETRAIT DOMICILE', gainAgent);
        logHistory(dbKey(ADMIN), '💸 COMMISSION RETRAIT DOMICILE', gainPlateforme);
        db.ref('ika_retraits_domicile/' + id).update({ client_confirme_recu: true, statut: 'termine', dateTermine: Date.now() });
        envoyerNotification(d.agentPhone, { type: 'retrait_confirme', titre: '✅ Retrait confirmé par le client !',
            message: `${me.name} a confirmé avoir reçu le cash.`, date: Date.now(), lu: false });
        toast("✅ Retrait confirmé ! Commission créditée");
        db.ref('users/' + dbKey(d.agentPhone)).once('value', snap2 => {
            const u = snap2.val();
            if (u) {
                demanderEvaluation('💵 Retrait Domicile', dbKey(d.agentPhone), u.name, id);
            }
        });
        chargerMesRetraits();
    });
};

window.clientSignaleLitigeRetraitDomicile = function(id) {

window.annulerRetraitDomicile = function(id) {

        const d = snap.val();
